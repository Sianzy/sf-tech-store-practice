<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Bean Boutique</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="custom-header">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fas fa-coffee"></i> Bean Boutique</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="coffee.html">Coffee Selection</a>
                <a href="equipment.html">Equipment</a>
                <a href="events.html">Events</a>
                <a href="offers.html">Offers</a>
                <a href="cart.html" class="cart-link active"><i class="fas fa-shopping-cart"></i> Cart (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="page-container">
        <h1 class="page-title">Your Selected Items</h1>

        <div class="cart-wrapper">
            <div id="cart-items-container" class="cart-items-list">
                </div>

            <div class="cart-summary-box">
                <h2>Order Summary</h2>
                <hr>
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">$0.00</span>
                </div>
                <div class="summary-line">
                    <span>Estimated Shipping</span>
                    <span class="text-success">FREE</span>
                </div>
                <hr>
                <div class="summary-line total">
                    <strong>Total Amount</strong>
                    <strong id="cart-total">$0.00</strong>
                </div>
                <button class="btn-checkout" onclick="executeCheckout()">Proceed To Checkout</button>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script> 
</body>
</html>
